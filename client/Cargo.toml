[package]
name = "rdclient"
version = "0.1.0"
edition = "2021"

[dependencies]
rdproto = { path = "../proto" }
rdnet = { path = "../netcommon" }
quinn = "0.11"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
gstreamer = "0.23"
gstreamer-app = "0.23"
evdev = "0.13"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
tempfile = "3.27.0"
